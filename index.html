<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tab icon: the clover mark. SVG for current browsers, ICO for older ones and search engines. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#050506" />

    <!--
      Applies the saved theme before first paint so a returning light-mode
      visitor never sees a dark flash. Deliberately ignores prefers-color-scheme:
      a first-time visitor always gets dark. Mirrors src/lib/theme.jsx.
    -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('gc-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        // The phone's browser bar matches the page background.
        var bar = document.querySelector('meta[name="theme-color"]')
        if (bar) bar.setAttribute('content', theme === 'light' ? '#ffffff' : '#050506')
      })()
    </script>

    <title>Gen Clover | Digital Products, Technology &amp; AI Solutions</title>
    <meta
      name="description"
      content="Gen Clover designs and builds digital products that move businesses forward: websites, web applications, e-commerce, AI and automation, data, DevOps and SEO."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gen Clover" />
    <meta property="og:title" content="Gen Clover | Digital Products, Technology &amp; AI Solutions" />
    <meta
      property="og:description"
      content="Next-generation intelligence. Growing possibilities. We design and build digital products that move businesses forward."
    />
    <meta property="og:image" content="https://www.genclover.com/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Site-wide organization data. Page-specific structured data (services,
         jobs, breadcrumbs) is added to each page at build time by scripts/prerender.mjs. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.genclover.com/#organization",
        "name": "Gen Clover",
        "url": "https://www.genclover.com",
        "logo": "https://www.genclover.com/icon-512.png",
        "email": "contact@genclover.com",
        "description": "Gen Clover designs and builds digital products: websites, web applications, e-commerce, AI and automation, data, DevOps and SEO.",
        "address": { "@type": "PostalAddress", "addressLocality": "Chandigarh", "addressCountry": "IN" },
        "sameAs": ["https://www.linkedin.com/company/gen-clover/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
