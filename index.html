    />

    <meta name="theme-color" content="#050506" />

    <!--
      Applies the saved theme before first paint so a returning light-mode
      visitor never sees a dark flash. Deliberately ignores prefers-color-scheme:
      a first-time visitor always gets dark. Mirrors src/lib/theme.jsx.
    -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('gc-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        // The phone's browser bar matches the page background.
        var bar = document.querySelector('meta[name="theme-color"]')
        if (bar) bar.setAttribute('content', theme === 'light' ? '#ffffff' : '#050506')
      })()
    </script>

    <title>Gen Clover | Digital Products, Technology &amp; AI Solutions</title>
